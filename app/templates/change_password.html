{% extends "base.html" %}{% block title %}Ganti password{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:40px auto">
<h1>Ganti password</h1>
{% if user.must_change_password %}<p class="mut">Anda harus mengganti password sebelum memakai aplikasi.</p>{% endif %}
<form method="post" action="/change-password">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Password saat ini</label><input type="password" name="current" autocomplete="current-password" required>
<label>Password baru</label><input type="password" name="new" autocomplete="new-password" required>
<label>Ulangi password baru</label><input type="password" name="confirm" autocomplete="new-password" required>
<p class="mut">Minimal 10 karakter, kombinasi huruf dan angka/simbol.</p>
<p><button>Simpan</button></p>
</form></div>
{% endblock %}
